  <style>

  <div data-hf-id="hf-2j0q" id="root" data-composition-id="privada" data-width="1920" data-height="1080">
    <div data-hf-id="hf-41sb" id="p-t" class="serif">Tu voz no sale de tu Mac</div>
    <div data-hf-id="hf-gmkh" id="p-badge"><span data-hf-id="hf-lcjz">Transcripción local</span></div>

    <div data-hf-id="hf-ywnd" id="p-mac">
      <svg data-hf-id="hf-dnjk" id="p-frame" viewBox="0 0 1920 1080">
        <rect data-hf-id="hf-arnc" id="p-scr" x="560" y="330" width="800" height="500" rx="28" fill="none" stroke="#EDEBE7" stroke-opacity=".55" stroke-width="4" pathLength="1" stroke-dasharray="1" />
        <path data-hf-id="hf-53lr" id="p-base" d="M470 846 H1450 Q1450 872 1420 872 H500 Q470 872 470 846 Z" fill="none" stroke="#EDEBE7" stroke-opacity=".55" stroke-width="4" pathLength="1" stroke-dasharray="1" />
      </svg>
      <div data-hf-id="hf-qk4c" id="p-screen">
        <div data-hf-id="hf-bmcj" class="p-ring"><i data-hf-id="hf-wt6k"></i></div><div data-hf-id="hf-952b" class="p-ring"><i data-hf-id="hf-zeb8"></i></div><div data-hf-id="hf-8qra" class="p-ring"><i data-hf-id="hf-y7e5"></i></div>
        <div data-hf-id="hf-ed8k" id="p-pd"><div data-hf-id="hf-chsv" id="p-pill" class="pill"><div data-hf-id="hf-wmkr" class="wave" id="p-wave"></div></div></div>
      </div>

  <script src="assets/hb.js"></script>
  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);
      const bars = HB.bars($("#p-wave"));
      const rings = [...document.querySelectorAll(".p-ring i")];

      // El Mac se dibuja y la píldora graba adentro.
      tl.fromTo(["#p-scr", "#p-base"], { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.8, stagger: 0.12, ease: "power3.inOut" }, 0.05);
      tl.fromTo("#p-pill", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1.4, duration: 0.45, ease: "back.out(1.4)", immediateRender: false }, 0.5);
      HB.drive(tl, 0.5, 5.6, (t) => {
        HB.setWave(bars, t + 40, Math.min(1, t / 0.2));
        // Ondas que crecen y chocan con el borde de la pantalla: no salen.
        rings.forEach((r, i) => {
          const k = (t * 0.55 + i / 3) % 1;
          r.style.transform = `scale(${1 + k * 9})`;
          r.style.opacity = t < 0.3 ? 0 : String((1 - k) * Math.max(0, Math.min(1, (5.0 - t) / 0.3)));
        });
      });

      tl.fromTo(HB.words($("#p-t")), { opacity: 0, scale: 1.3, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.34, stagger: 0.09, ease: "expo.out" }, 0.35);
      tl.fromTo("#p-badge", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)", immediateRender: false }, 1.3);

      // Línea rodante, una por cada dos beats.
      const lines = [...document.querySelectorAll("#p-roll div")];
      [2.03, 3.05, 4.07].forEach((at, i) => {
        tl.fromTo(lines[i], { opacity: 1, y: 60 }, { y: 0, duration: 0.4, ease: "power4.out", immediateRender: false }, at);
        if (i < 2) tl.to(lines[i], { y: -60, duration: 0.3, ease: "power3.in" }, [3.05, 4.07][i] - 0.05);
      });

      // Salida: la pantalla se enciende y la cámara entra en ella.
      tl.to(["#p-t", "#p-badge", "#p-roll"], { opacity: 0, filter: "blur(10px)", duration: 0.25, ease: "power3.in" }, 5.25);
      tl.to("#p-pill", { opacity: 0, scale: 1.1, duration: 0.2, ease: "power3.in" }, 5.3);
      tl.to("#p-screen", { backgroundColor: "rgba(243,241,236,1)", duration: 0.3, ease: "power2.in" }, 5.35);
      tl.to("#p-mac", { scale: 2.7, transformOrigin: "960px 580px", duration: 0.7, ease: "power3.in" }, 5.4);

      window.__timelines["privada"] = tl;
    })();
  </script>
