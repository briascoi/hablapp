  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);
      const bars = HB.bars($("#g-wave"));
      const dots = [...document.querySelectorAll("#g-proc .dots i")];
      const EDGE = "#B86E10";
      const IN = { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" };
      const BL = { opacity: 0, filter: "blur(8px)" };

      // Estado inicial: frame 0 ya muestra la tecla y la rayita.

      // Píldora: graba, procesa y vuelve a reposo. La tecla acompaña.
      function record(at, dur, opts = {}) {
        const key = opts.key || "#g-key";
        const deep = key === "#g-bigkey" ? 14 : 6;
        const sh = key === "#g-bigkey" ? 16 : 7;
        tl.fromTo(key, { y: 0, boxShadow: `0 ${sh}px 0 ${EDGE}` }, { y: deep, boxShadow: `0 1px 0 ${EDGE}`, duration: 0.07, ease: "power2.out", immediateRender: false }, at);
        tl.fromTo("#g-dash", { opacity: 1 }, { opacity: 0, duration: 0.12, immediateRender: false }, at);
        tl.fromTo("#g-rec", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.4)", immediateRender: false }, at);
        HB.drive(tl, at, dur, (t) => HB.setWave(bars, t + at, Math.min(1, t / 0.15)));
        if (opts.raw) {
          tl.fromTo("#g-live", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.25, ease: "expo.out", immediateRender: false }, at + 0.05);
          HB.drive(tl, at + 0.1, dur - 0.2, (t) => HB.type($("#g-livetxt"), opts.raw, t / (dur - 0.35)));
          tl.to("#g-live", { opacity: 0, duration: 0.15, ease: "power3.in" }, at + dur);
        }
        const end = at + dur;
        if (opts.release !== false) {
          tl.to(key, { y: 0, boxShadow: `0 ${sh}px 0 ${EDGE}`, duration: 0.12, ease: "back.out(2)" }, end);
          tl.to("#g-rec", { opacity: 0, scale: 0.8, duration: 0.12, ease: "power3.in" }, end);
          tl.fromTo("#g-proc", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.15, ease: "expo.out", immediateRender: false }, end + 0.04);
          HB.drive(tl, end, 0.5, (t) => dots.forEach((d, i) => (d.style.opacity = 0.35 + 0.65 * Math.max(0, Math.sin(t * 12 - i * 0.7)))));
          tl.to("#g-proc", { opacity: 0, scale: 0.8, duration: 0.12, ease: "power3.in" }, end + (opts.proc || 0.42));
          tl.to("#g-dash", { opacity: 1, duration: 0.15 }, end + (opts.proc || 0.42) + 0.05);
        }
      }

      // A · 0 → 4.1 s: la frase se arma en los beats.
      record(0.035, 2.54, { key: "#g-bigkey" });
      tl.fromTo("#g-w1", BL, IN, 0.3);
      tl.fromTo(["#g-w2", "#g-w3"], BL, { ...IN, stagger: 0.07 }, 1.06);
      tl.fromTo("#g-w4", BL, IN, 1.82);
      tl.fromTo("#g-w5", BL, IN, 2.07);
      tl.to("#g-sent", { y: -260, opacity: 0, filter: "blur(16px)", duration: 0.32, ease: "power3.in" }, 3.72);

      // B · 4.1 → 10.2 s: el correo recibe el dictado con puntuación.
      tl.fromTo("#g-mail", { opacity: 0, y: 420, filter: "blur(16px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 4.0);
      tl.fromTo("#g-key", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)", immediateRender: false }, 4.15);
      const mailRaw = "hola estás libre para almorzar mañana hagamos a las 12 si te queda bien";
      record(4.6, 3.05, { raw: mailRaw });
      const mailOut = 'Hola<span class="pm">,</span> <span class="pm">¿</span>estás libre para almorzar mañana<span class="pm">?</span> Hagamos a las 12 si te queda bien<span class="pm">.</span>';
      $("#g-mailtxt").innerHTML = mailOut;
      HB.drive(tl, 8.12, 0.1, (t) => ($("#g-mailtxt").style.display = t > 0.05 ? "inline" : "none"));
      tl.fromTo("#g-mail .pm", { color: "#F4A647" }, { color: "#1C1B1A", duration: 0.9, ease: "power2.inOut", immediateRender: false }, 8.6);
      const t1 = HB.words($("#g-t1"));
      tl.set("#g-t1", { opacity: 1 }, 8.3);
      tl.fromTo(t1, { color: "#D3CFC7" }, { color: "#1C1B1A", duration: 0.25, stagger: 0.08, ease: "power2.out", immediateRender: false }, 8.3);
      tl.to("#g-t1", { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power3.in" }, 9.95);

      // C · 10.2 → 14.3 s: el mismo gesto en otras apps; la píldora no se mueve.
      const apps = [
        { win: "#g-msg", txt: "#g-msgtxt", at: 10.205, raw: "sí llevo el postre", out: "¡Sí! Llevo el postre." },
        { win: "#g-note", txt: "#g-notetxt", at: 11.73, raw: "ideas video corto landing nueva y demo en vivo el jueves", out: "Ideas: video corto, landing nueva y demo en vivo el jueves." },
        { win: "#g-doc", txt: "#g-doctxt", at: 13.255, raw: "cerramos el presupuesto y la fecha de entrega", out: "Cerramos el presupuesto y la fecha de entrega." },
      ];
      let prev = "#g-mail";
      apps.forEach((a) => {
        tl.to(prev, { x: -1900, filter: "blur(20px)", duration: 0.3, ease: "power3.in" }, a.at - 0.27);
        tl.fromTo(a.win, { opacity: 1, x: 1900, filter: "blur(20px)" }, { x: 0, filter: "blur(0px)", duration: 0.4, ease: "power3.out", immediateRender: false }, a.at);
        record(a.at + 0.25, 0.68, { raw: a.raw, proc: 0.2 });
        HB.drive(tl, a.at + 1.08, 0.1, (t) => {
          const el = $(a.txt);
          el.textContent = t > 0.05 ? a.out : (a.txt === "#g-msgtxt" ? "Mensaje" : "");
          el.className = t > 0.05 ? "" : (a.txt === "#g-msgtxt" ? "ph" : "");
        });
        prev = a.win;
      });

      // 14.3 s: zoom out, las cuatro apps a la vez.
      const grid = [["#g-mail", 650, 330], ["#g-msg", 1270, 330], ["#g-note", 650, 625], ["#g-doc", 1270, 625]];
      grid.forEach(([w, cx, cy], i) => {
        tl.to(w, { x: cx - 960, y: cy - 470, scale: 0.42, filter: "blur(0px)", opacity: 1, duration: 0.7, ease: "power2.inOut" }, 14.275 + i * 0.03);
      });
      tl.to("#g-key", { opacity: 0, scale: 0.6, duration: 0.2, ease: "power3.in" }, 15.2);
      // Graba otra vez y el naranja se abre desde la píldora.
      record(15.45, 0.9, { release: false });
      tl.fromTo("#g-iris", { scale: 0 }, { scale: 96, duration: 0.5, ease: "power3.in" }, 15.8);

      window.__timelines["gancho"] = tl;
